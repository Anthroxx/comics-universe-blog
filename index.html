<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Comics Universe</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <!-- Cabecera principal -->
    <header>
        <h1>Comics Universe</h1>
    </header>

    <!-- Contenido principal -->
    <main>
        <!-- Contenedor del formulario del login -->
        <div class="login-container">
            <h2>Acceso al Portal</h2>

            <!-- Formulario conectado a la función JavaScript usando onsubmit -->
            <form id="loginForm" onsubmit="validarLogin(event)">

                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" placeholder="Ingresa admin" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa 12345" required>
                </div>

                <!-- Botón para mandar el formulario -->
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Ingresar</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Blog Comics - Actividad 1 UNIR. | Desarrollo de Aplicaciones en Red</p>
        <p>Creado por Antonio de Jesus Sanchez Rayon</a>.</p>
    </footer>

    <script src="assets/js/login.js"></script>
</body>

</html>
